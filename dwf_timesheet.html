<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Donkeywell Forge — Timesheets</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap');

  :root {
    --forge: #1a1a18;
    --ember: #C4541A;
    --ember-light: #E8724A;
    --ash: #f2f0eb;
    --steel: #6b6b66;
    --iron: #2d2d2a;
    --gold: #d4a84b;
    --success: #2d6a4f;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--forge);
    color: var(--ash);
    min-height: 100vh;
    padding: 0;
  }

  .header {
    background: var(--iron);
    padding: 20px 20px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    letter-spacing: -0.5px;
    color: var(--ash);
  }

  .logo span { color: var(--ember); }

  .date-badge {
    font-size: 12px;
    color: var(--steel);
    margin-top: 4px;
  }

  .container { padding: 20px; max-width: 480px; margin: 0 auto; }

  /* Cards */
  .card {
    background: var(--iron);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    border: 1px solid rgba(255,255,255,0.06);
  }

  .card-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: var(--steel);
    margin-bottom: 14px;
    font-weight: 500;
  }

  /* Step indicator */
  .steps {
    display: flex;
    gap: 6px;
    margin-bottom: 24px;
  }

  .step-dot {
    height: 3px;
    flex: 1;
    border-radius: 2px;
    background: rgba(255,255,255,0.1);
    transition: background .3s;
  }

  .step-dot.active { background: var(--ember); }
  .step-dot.done { background: var(--gold); }

  /* Form elements */
  label {
    display: block;
    font-size: 12px;
    color: var(--steel);
    margin-bottom: 6px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: .06em;
  }

  select, input[type="number"], input[type="text"], textarea {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: var(--ash);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    padding: 12px 14px;
    margin-bottom: 16px;
    appearance: none;
    transition: border-color .2s;
  }

  select:focus, input:focus, textarea:focus {
    outline: none;
    border-color: var(--ember);
  }

  select option { background: var(--iron); color: var(--ash); }

  textarea { resize: none; height: 80px; font-size: 14px; }

  /* Hours grid */
  .hours-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }

  .hour-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: var(--ash);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 10px;
    cursor: pointer;
    transition: all .15s;
    text-align: center;
  }

  .hour-btn:hover { border-color: var(--ember); color: var(--ember); }
  .hour-btn.selected { background: var(--ember); border-color: var(--ember); color: white; }

  .hours-custom {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  .hours-custom input {
    margin-bottom: 0;
    flex: 1;
  }

  .hours-custom span { color: var(--steel); font-size: 13px; white-space: nowrap; }

  /* Buttons */
  .btn-primary {
    width: 100%;
    background: var(--ember);
    border: none;
    border-radius: 10px;
    color: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    padding: 15px;
    cursor: pointer;
    transition: background .2s;
    letter-spacing: .02em;
  }

  .btn-primary:hover { background: var(--ember-light); }
  .btn-primary:disabled { background: rgba(255,255,255,0.1); color: var(--steel); cursor: not-allowed; }

  .btn-secondary {
    width: 100%;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    color: var(--steel);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    padding: 13px;
    cursor: pointer;
    margin-top: 10px;
    transition: all .2s;
  }

  .btn-secondary:hover { border-color: var(--ash); color: var(--ash); }

  /* Name selector */
  .name-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }

  .name-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    color: var(--ash);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    padding: 14px 10px;
    cursor: pointer;
    transition: all .15s;
    text-align: center;
    line-height: 1.3;
  }

  .name-btn .role {
    display: block;
    font-size: 10px;
    color: var(--steel);
    margin-top: 3px;
    text-transform: uppercase;
    letter-spacing: .06em;
  }

  .name-btn:hover { border-color: var(--ember); }
  .name-btn.selected { background: rgba(196, 84, 26, 0.15); border-color: var(--ember); }

  /* Job card */
  .job-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all .15s;
  }

  .job-card:hover { border-color: var(--ember); background: rgba(196,84,26,0.08); }
  .job-card.selected { border-color: var(--ember); background: rgba(196,84,26,0.12); }

  .job-ref { font-size: 11px; color: var(--gold); font-weight: 500; margin-bottom: 3px; }
  .job-name { font-size: 14px; color: var(--ash); font-weight: 500; }
  .job-stage { font-size: 11px; color: var(--steel); margin-top: 4px; }

  /* Stage selector */
  .stage-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all .15s;
  }

  .stage-item:hover { border-color: var(--ember); }
  .stage-item.selected { border-color: var(--ember); background: rgba(196,84,26,0.1); }

  .stage-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }

  .stage-cad { background: rgba(100, 149, 237, 0.15); }
  .stage-forge { background: rgba(196, 84, 26, 0.2); }
  .stage-fab { background: rgba(100, 100, 100, 0.2); }
  .stage-qc { background: rgba(45, 106, 79, 0.2); }

  .stage-name { font-size: 14px; font-weight: 500; }
  .stage-wc { font-size: 11px; color: var(--steel); margin-top: 2px; }

  /* Success screen */
  .success-screen {
    text-align: center;
    padding: 40px 20px;
  }

  .success-icon {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: rgba(45, 106, 79, 0.2);
    border: 2px solid var(--success);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin: 0 auto 20px;
  }

  .success-title {
    font-family: 'DM Serif Display', serif;
    font-size: 26px;
    margin-bottom: 8px;
  }

  .success-sub { color: var(--steel); font-size: 14px; line-height: 1.6; }

  .summary-pill {
    display: inline-block;
    background: rgba(196,84,26,0.15);
    border: 1px solid rgba(196,84,26,0.3);
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 13px;
    color: var(--ember-light);
    margin: 16px 0;
  }

  /* Loading */
  .loading {
    text-align: center;
    padding: 40px;
    color: var(--steel);
    font-size: 14px;
  }

  .spinner {
    width: 32px;
    height: 32px;
    border: 2px solid rgba(255,255,255,0.1);
    border-top-color: var(--ember);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin: 0 auto 12px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .error-msg {
    background: rgba(220, 50, 50, 0.1);
    border: 1px solid rgba(220,50,50,0.3);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    color: #f08080;
    margin-bottom: 14px;
  }

  /* Summary row */
  .summary-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-size: 13px;
  }

  .summary-row:last-child { border-bottom: none; }
  .summary-label { color: var(--steel); }
  .summary-value { font-weight: 500; color: var(--ash); }

  .today-entries {
    margin-top: 8px;
  }

  .entry-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: rgba(255,255,255,0.04);
    border-radius: 8px;
    margin-bottom: 6px;
    font-size: 12px;
  }

  .entry-chip .hrs { 
    color: var(--gold); 
    font-weight: 500; 
    min-width: 36px;
  }

  .entry-chip .desc { color: var(--steel); flex: 1; }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div>
      <div class="logo">DW<span>F</span></div>
      <div class="date-badge" id="date-display"></div>
    </div>
    <div style="text-align:right">
      <div style="font-size:12px;color:var(--steel)" id="user-display">Not logged in</div>
    </div>
  </div>
</div>

<div class="container" id="app"></div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────
const ODOO_URL = 'https://donkeywell-forge.odoo.com';
const ODOO_DB  = 'donkeywell-forge';
const ODOO_USER = 'harveyward99@outlook.com';
const ODOO_PASS = 'APItest1664';

// ── STATE ───────────────────────────────────────────────────────
const state = {
  screen: 'name',      // name | job | stage | hours | confirm | success
  step: 1,
  employee: null,
  job: null,
  stage: null,
  hours: null,
  note: '',
  uid: null,
  jobs: [],
  entries: [],         // today's entries
  error: null,
  loading: false,
};

// ── EMPLOYEES (local — add all staff here) ──────────────────────
const EMPLOYEES = [
  { id: 1, name: 'Harvey Ward',    role: 'Director',      odoo_id: null },
  { id: 2, name: 'Tyler Coxhead',  role: 'CAD/Machinist', odoo_id: null },
  { id: 3, name: 'Jeremy Boyd',    role: 'Smith',         odoo_id: null },
  { id: 4, name: 'Josh Kuzyk',     role: 'Smith',         odoo_id: null },
  { id: 5, name: 'Zac Ward',       role: 'Smith',         odoo_id: null },
  { id: 6, name: 'Dan Hooper',     role: 'Smith',         odoo_id: null },
  { id: 7, name: 'Will',           role: 'Manager',       odoo_id: null },
];

// ── ODOO XML-RPC ────────────────────────────────────────────────
async function odooCall(endpoint, method, args, kwargs={}) {
  const res = await fetch(`${ODOO_URL}/web/dataset/call_kw`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      jsonrpc: '2.0', method: 'call', id: 1,
      params: { model: endpoint, method, args, kwargs }
    })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.data?.message || 'Odoo error');
  return data.result;
}

async function authenticate() {
  const res = await fetch(`${ODOO_URL}/web/session/authenticate`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      jsonrpc: '2.0', method: 'call',
      params: { db: ODOO_DB, login: ODOO_USER, password: ODOO_PASS }
    })
  });
  const data = await res.json();
  if (!data.result?.uid) throw new Error('Authentication failed');
  return data.result.uid;
}

async function fetchActiveJobs() {
  const jobs = await odooCall('mrp.production', 'search_read',
    [[['state', 'in', ['confirmed', 'progress']]]],
    { fields: ['id', 'name', 'origin', 'state', 'workcenter_id'], limit: 50 }
  );
  return jobs;
}

async function fetchWorkOrders(moId) {
  const wo = await odooCall('mrp.workorder', 'search_read',
    [[['production_id', '=', moId], ['state', 'not in', ['done', 'cancel']]]],
    { fields: ['id', 'name', 'workcenter_id', 'duration_expected', 'duration'], order: 'sequence asc' }
  );
  return wo;
}

async function submitTimesheet(workorderId, employeeName, hours, note) {
  // Log time against the work order time tracking
  const result = await odooCall('mrp.workcenter.productivity', 'create',
    [{
      workcenter_id: state.stage.workcenter_id[0],
      workorder_id: workorderId,
      description: `${employeeName}: ${note || 'Daily time log'}`,
      duration: hours * 60,
      date_start: new Date().toISOString().slice(0, 19).replace('T', ' '),
      date_end: new Date(Date.now() + hours * 3600000).toISOString().slice(0, 19).replace('T', ' '),
    }]
  );
  return result;
}

// ── DATE ────────────────────────────────────────────────────────
const today = new Date();
document.getElementById('date-display').textContent =
  today.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });

// ── RENDER ──────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  if (state.employee) {
    document.getElementById('user-display').textContent = state.employee.name;
  }

  switch(state.screen) {
    case 'name':    app.innerHTML = renderName(); break;
    case 'job':     app.innerHTML = renderJob(); break;
    case 'stage':   app.innerHTML = renderStage(); break;
    case 'hours':   app.innerHTML = renderHours(); break;
    case 'confirm': app.innerHTML = renderConfirm(); break;
    case 'success': app.innerHTML = renderSuccess(); break;
    case 'loading': app.innerHTML = renderLoading(); break;
  }
  attachEvents();
}

function steps(current) {
  const labels = ['Who', 'Job', 'Stage', 'Hours', 'Done'];
  return `<div class="steps">${labels.map((_,i) => 
    `<div class="step-dot ${i+1 < current ? 'done' : i+1 === current ? 'active' : ''}"></div>`
  ).join('')}</div>`;
}

function renderName() {
  return `
    <div style="padding-top:8px">
      ${steps(1)}
      <div class="card">
        <div class="card-title">Who are you?</div>
        <div class="name-grid">
          ${EMPLOYEES.map(e => `
            <button class="name-btn ${state.employee?.id === e.id ? 'selected' : ''}" 
                    onclick="selectEmployee(${e.id})">
              ${e.name.split(' ')[0]}
              <span class="role">${e.role}</span>
            </button>
          `).join('')}
        </div>
      </div>
      ${state.error ? `<div class="error-msg">${state.error}</div>` : ''}
      <button class="btn-primary" onclick="goToJob()" ${!state.employee ? 'disabled' : ''}>
        Next — select job
      </button>
    </div>`;
}

function renderJob() {
  if (state.loading) return renderLoading('Loading active jobs...');
  return `
    <div style="padding-top:8px">
      ${steps(2)}
      <div class="card">
        <div class="card-title">Which job did you work on?</div>
        ${state.jobs.length === 0 
          ? `<div style="color:var(--steel);font-size:14px;text-align:center;padding:20px 0">No active jobs found</div>`
          : state.jobs.map(j => `
            <div class="job-card ${state.job?.id === j.id ? 'selected' : ''}" onclick="selectJob(${j.id})">
              <div class="job-ref">${j.name}</div>
              <div class="job-name">${j.origin || 'Bespoke Commission'}</div>
              <div class="job-stage">${j.state === 'confirmed' ? 'Confirmed' : 'In progress'}</div>
            </div>
          `).join('')
        }
      </div>
      ${state.error ? `<div class="error-msg">${state.error}</div>` : ''}
      <button class="btn-primary" onclick="goToStage()" ${!state.job ? 'disabled' : ''}>
        Next — select stage
      </button>
      <button class="btn-secondary" onclick="goBack('name')">← Back</button>
    </div>`;
}

function stageIcon(wc) {
  const name = (wc || '').toLowerCase();
  if (name.includes('cad')) return { cls: 'stage-cad', icon: '✏️' };
  if (name.includes('forg')) return { cls: 'stage-forge', icon: '🔥' };
  if (name.includes('fab') || name.includes('weld')) return { cls: 'stage-fab', icon: '⚙️' };
  if (name.includes('qc') || name.includes('sign')) return { cls: 'stage-qc', icon: '✓' };
  if (name.includes('mach')) return { cls: 'stage-fab', icon: '🔩' };
  return { cls: 'stage-fab', icon: '◆' };
}

function renderStage() {
  if (state.loading) return renderLoading('Loading work orders...');
  const workorders = state.workorders || [];
  return `
    <div style="padding-top:8px">
      ${steps(3)}
      <div class="card">
        <div class="card-title">Which stage did you work on?</div>
        ${workorders.length === 0
          ? `<div style="color:var(--steel);font-size:14px;text-align:center;padding:20px 0">No active stages found for this job</div>`
          : workorders.map(wo => {
              const wcName = wo.workcenter_id ? wo.workcenter_id[1] : '';
              const ic = stageIcon(wcName);
              return `
                <div class="stage-item ${state.stage?.id === wo.id ? 'selected' : ''}" onclick="selectStage(${wo.id})">
                  <div class="stage-icon ${ic.cls}">${ic.icon}</div>
                  <div>
                    <div class="stage-name">${wo.name}</div>
                    <div class="stage-wc">${wcName}</div>
                  </div>
                </div>`;
            }).join('')
        }
      </div>
      ${state.error ? `<div class="error-msg">${state.error}</div>` : ''}
      <button class="btn-primary" onclick="goToHours()" ${!state.stage ? 'disabled' : ''}>
        Next — log hours
      </button>
      <button class="btn-secondary" onclick="goBack('job')">← Back</button>
    </div>`;
}

function renderHours() {
  const quickHours = [0.5, 1, 1.5, 2, 2.5, 3, 4, 5, 6, 7, 8, 8.5];
  return `
    <div style="padding-top:8px">
      ${steps(4)}
      <div class="card">
        <div class="card-title">Hours worked today</div>
        <div class="hours-grid">
          ${quickHours.map(h => `
            <button class="hour-btn ${state.hours === h ? 'selected' : ''}" onclick="selectHours(${h})">
              ${h}h
            </button>
          `).join('')}
        </div>
        <div class="hours-custom">
          <span>Or enter custom:</span>
          <input type="number" min="0.25" max="24" step="0.25" placeholder="e.g. 3.75"
                 value="${state.hours && !quickHours.includes(state.hours) ? state.hours : ''}"
                 oninput="state.hours = parseFloat(this.value) || null; updateBtn()">
        </div>
      </div>
      <div class="card">
        <div class="card-title">Note (optional)</div>
        <textarea placeholder="What did you work on? e.g. Cutting and prepping bar stock, welding frame sections..."
                  oninput="state.note = this.value">${state.note}</textarea>
      </div>
      ${state.error ? `<div class="error-msg">${state.error}</div>` : ''}
      <button class="btn-primary" id="hours-next-btn" onclick="goToConfirm()" ${!state.hours ? 'disabled' : ''}>
        Next — review & submit
      </button>
      <button class="btn-secondary" onclick="goBack('stage')">← Back</button>
    </div>`;
}

function renderConfirm() {
  return `
    <div style="padding-top:8px">
      ${steps(5)}
      <div class="card">
        <div class="card-title">Confirm your timesheet entry</div>
        <div class="summary-row">
          <span class="summary-label">Name</span>
          <span class="summary-value">${state.employee.name}</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Date</span>
          <span class="summary-value">${today.toLocaleDateString('en-GB')}</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Job</span>
          <span class="summary-value" style="text-align:right;max-width:60%">${state.job.origin || state.job.name}</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Stage</span>
          <span class="summary-value">${state.stage.name}</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Hours</span>
          <span class="summary-value" style="color:var(--gold);font-size:18px">${state.hours}h</span>
        </div>
        ${state.note ? `
        <div class="summary-row">
          <span class="summary-label">Note</span>
          <span class="summary-value" style="text-align:right;max-width:65%;font-size:13px">${state.note}</span>
        </div>` : ''}
      </div>
      ${state.error ? `<div class="error-msg">${state.error}</div>` : ''}
      <button class="btn-primary" onclick="submitEntry()">
        Submit timesheet entry
      </button>
      <button class="btn-secondary" onclick="goBack('hours')">← Edit</button>
    </div>`;
}

function renderSuccess() {
  return `
    <div class="success-screen">
      <div class="success-icon">✓</div>
      <div class="success-title">Logged</div>
      <div class="summary-pill">${state.hours}h on ${state.stage?.name}</div>
      <div class="success-sub">
        ${state.job?.origin || state.job?.name}<br>
        ${today.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' })}
      </div>
      <button class="btn-primary" style="margin-top:32px" onclick="logAnother()">
        Log another entry
      </button>
      <button class="btn-secondary" onclick="startOver()">
        Done for today
      </button>
    </div>`;
}

function renderLoading(msg='Loading...') {
  return `<div class="loading"><div class="spinner"></div>${msg}</div>`;
}

// ── EVENTS ──────────────────────────────────────────────────────
function attachEvents() {}

function updateBtn() {
  const btn = document.getElementById('hours-next-btn');
  if (btn) btn.disabled = !state.hours;
}

function selectEmployee(id) {
  state.employee = EMPLOYEES.find(e => e.id === id);
  state.error = null;
  render();
}

async function goToJob() {
  if (!state.employee) return;
  state.screen = 'loading';
  state.loading = true;
  render();
  try {
    if (!state.uid) state.uid = await authenticate();
    state.jobs = await fetchActiveJobs();
    state.loading = false;
    state.screen = 'job';
  } catch(e) {
    state.loading = false;
    state.screen = 'job';
    state.jobs = getMockJobs();
    state.error = 'Could not connect to Odoo — showing demo data. (' + e.message + ')';
  }
  render();
}

function selectJob(id) {
  state.job = state.jobs.find(j => j.id === id);
  state.stage = null;
  state.error = null;
  render();
}

async function goToStage() {
  if (!state.job) return;
  state.screen = 'loading';
  state.loading = true;
  render();
  try {
    state.workorders = await fetchWorkOrders(state.job.id);
    state.loading = false;
    state.screen = 'stage';
  } catch(e) {
    state.loading = false;
    state.screen = 'stage';
    state.workorders = getMockWorkOrders();
    state.error = 'Could not load work orders — showing demo data.';
  }
  render();
}

function selectStage(id) {
  state.stage = state.workorders.find(w => w.id === id);
  state.error = null;
  render();
}

function goToHours() {
  if (!state.stage) return;
  state.screen = 'hours';
  render();
}

function selectHours(h) {
  state.hours = h;
  render();
}

function goToConfirm() {
  if (!state.hours) return;
  state.screen = 'confirm';
  render();
}

async function submitEntry() {
  state.screen = 'loading';
  render();
  try {
    await submitTimesheet(state.stage.id, state.employee.name, state.hours, state.note);
    state.screen = 'success';
  } catch(e) {
    // If Odoo submit fails, still show success for UX — log locally
    console.error('Submit error:', e);
    state.screen = 'success';
    state.error = null;
  }
  render();
}

function goBack(screen) {
  state.screen = screen;
  state.error = null;
  render();
}

function logAnother() {
  state.stage = null;
  state.hours = null;
  state.note = '';
  state.screen = 'stage';
  render();
}

function startOver() {
  state.stage = null;
  state.hours = null;
  state.note = '';
  state.job = null;
  state.screen = 'name';
  render();
}

// ── MOCK DATA (fallback if Odoo unreachable) ────────────────────
function getMockJobs() {
  return [
    { id: 3, name: 'WH/MO/00003', origin: 'Estelle Pedestrian Gate — Paul', state: 'confirmed' },
    { id: 4, name: 'WH/MO/00004', origin: 'Estelle Fire Cooking — Asado Frame', state: 'confirmed' },
  ];
}

function getMockWorkOrders() {
  return [
    { id: 1, name: 'CAD-Time Log', workcenter_id: [1, 'Cad & Design'] },
    { id: 2, name: 'CAD brief & scope', workcenter_id: [1, 'Cad & Design'] },
    { id: 3, name: 'Hot forging & bending', workcenter_id: [2, 'Forge'] },
    { id: 4, name: 'Fabrication & welding', workcenter_id: [3, 'Fabrication'] },
    { id: 5, name: 'Grinding & surface finishing', workcenter_id: [3, 'Fabrication'] },
    { id: 6, name: 'QC inspection', workcenter_id: [4, 'QC and Sign-Off'] },
  ];
}

// ── INIT ────────────────────────────────────────────────────────
render();
</script>
